services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: classrecord-backend:1.1.0
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
